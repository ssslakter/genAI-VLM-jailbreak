[project]
name = "genai-vlm-jailbreak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Slava Chaunin", email = "67190162+Ssslakter@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "av",
    "datasets",
    "causal-conv1d==1.7.0+cu.13.0.torch.2.13",
    "flash-linear-attention>=0.5.2",
    "kernels>=0.17.2,<0.18",
    "transformers>=5.20.1",
    "vllm>=0.30.0",
]


[project.scripts]
genai-vlm-jailbreak = "genai_vlm_jailbreak:main"

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130"
explicit = true

[tool.uv.sources]
causal-conv1d = { index = "astral-cu130" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
